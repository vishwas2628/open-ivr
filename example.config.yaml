# ------------------------------------------------------------------
# openivr configuration TEMPLATE
#
# Copy this file to `config.yaml` and fill in your secrets:
#
#     cp example.config.yaml config.yaml
#
# `config.yaml` holds the secrets (ARI password, builder login, database
# password, SMTP password). It is git-ignored, created on first run and kept
# at mode 0600. Never commit it - commit this template instead.
#
# Values are merged in this order (later wins):
#   defaults in code -> config.yaml -> system.json (root, written by
#   system/ scripts) -> data/smtp.json (written by builder) -> OPENIVR_* env
#
# Anything the installer collected (SIP trunk, DB, ports, SMTP) is also kept
# in ./system.json; system/ scripts (30-ari.sh, 60-database.sh) write their
# secrets into config.yaml for you during `make install`.
# ------------------------------------------------------------------

app:
  name: openivr
  # Stasis app name; must match what the dialplan uses: Stasis(openivr).
  # This value is static - the builder cannot change it, because the same
  # name is declared in system/asterisk/ari.conf (stasis_app = openivr,openivr-admin).
  stasis_app: openivr
  # Delay after Answer() before the first prompt (let the far end settle)
  answer_delay: 0.4
  # Default accountcode for CDR when ARI does not supply one. The dialplan
  # uses {{company_id}} from the builder; this is the fallback.
  company_id: openivr

# ── Builder login ───────────────────────────────────────────────────────────
# Generated by the first-run wizard (`make builder` / `make install`).
# The password is stored as a bcrypt hash; the plaintext is printed once.
builder:
  company_name: ""            # asked during the first-run wizard
  username: "admin"           # slug of the company name by default
  password_hash: ""           # bcrypt hash - leave empty, the wizard fills it
  session_ttl: 7200           # seconds (120 min)
  session_secret: ""          # HMAC key for the session cookie, generated on first run

ari:
  # Built by system/ steps/30-ari.sh into system.json and config.yaml;
  # these are the fallback defaults for a fresh local run.
  base_url: http://127.0.0.1:8088
  username: openivr
  password: ""                # written by 30-ari.sh (secret - never commit)
  # Reconnect backoff (seconds), doubles up to max
  reconnect_initial: 2
  reconnect_max: 60

paths:
  project_root: "."
  flows: data/flows
  flow_file: data/ivr_flow.json
  sounds: data/sounds
  recordings: data/recordings
  logs: data/logs
  # Asterisk spool where ARI recordings land (chan recording / channel.record)
  asterisk_spool: /var/spool/asterisk/recording
  # Where run_ivr.sh syncs data/sounds so sound:<name> resolves
  asterisk_sounds: /var/lib/asterisk/sounds/custom

logging:
  level: INFO
  file: data/logs/openivr.log
  max_bytes: 4194304
  backup_count: 5
  console: true
  color: true
  # log format pieces
  format: "%(asctime)s | %(levelname)-8s | %(name)s | %(module)s:%(lineno)d | %(message)s"
  datefmt: "%Y-%m-%d %H:%M:%S"

ivr:
  # global menu behaviour (menus can override per-menu)
  prompt_timeout: 8          # seconds to wait for the first digit
  invalid_attempts: 2        # invalid-digit retries before fail action
  timeout_attempts: 2        # prompt-timeout retries before fail action
  max_menu_depth: 3          # flow validation refuses deeper nesting
  max_options_per_menu: 5    # plan: 5 keys per menu, 2-3 levels max
  interdigit_timeout: 4      # seconds between digits while collecting
  # hangup tone/announcement before we release the channel
  goodbye_prompt: goodbye

dial:
  # dialplan = pass the channel to the dialplan via continueInDialplan()
  #            into [openivr-dial] (clean CDR, plan default)
  # originate = LEGACY: ARI originate a leg + bridge (uses openivr.originate)
  #             retained only for the CLI escape hatch
  mode: dialplan
  context: openivr-dial
  extension: s
  priority: 1
  # originate options (only used when mode: originate - LEGACY)
  originate_endpoint: ""
  originate_timeout: 30
  dial_timeout: 45

voicemail:
  enabled: true
  dir: data/recordings/voicemail
  format: wav
  max_duration: 120         # seconds hard cap
  silence_timeout: 4        # seconds of silence that ends the message
  beep: true
  terminate_on: any         # any DTMF ends recording (Asterisk terminateOn)
  min_duration: 1

cdr:
  enabled: true
  # csv = IVR event log only (menu/digit/timing). The CALL RECORD comes from
  # Asterisk's native CDR engine (cdr.conf [csv] backend). postgres/both
  # removed - use Asterisk cdr.conf for call logs.
  backend: csv              # csv | none
  csv_file: data/logs/cdr.csv
  # postgres section retained for 60-database.sh schema provisioning only.
  # openivr no longer writes CDRs to Postgres.
  postgres:
    host: 127.0.0.1
    port: 5432
    dbname: ivrdb
    user: ivr
    password: ""              # written by 60-database.sh (secret - never commit)

smtp:
  enabled: false            # set true once data/smtp.json exists (builder)
  host: ""
  port: 587
  starttls: true
  username: ""
  password: ""              # secret - never commit
  from_addr: ""
  # recipients for service-down / system alerts
  alerts_to: []

record:
  # MixMonitor leg recording is configured from the builder
  # ("Permissions & Voicemail" step) and rendered into the dialplan;
  # this toggles ARI-side recording of the IVR leg itself
  ivr_leg: false
  dir: data/recordings/ivr
  # MixMonitor target directory on the Asterisk host
  mixmonitor_dir: /var/spool/asterisk/monitor
  # recordings older than this are pruned by the builder/systemd timer
  retention_days: 30

health:
  # interval for the background keep-alive / status log line (seconds)
  interval: 30