; Named Access Control Lists (ACLs)
;
; MANAGED BY OPENIVR - see system/asterisk/README.md
;
; These named ACLs are referenced by:
;   rtp.conf   -> ice_acl = rtp-ice
;   iax.conf   -> acl = iax-peers
;   (other modules may reference them by name)

[rtp-ice]
; ICE/STUN connectivity for WebRTC endpoints. Permit your public IP and any
; STUN/TURN servers you use. Deny all else.
deny = 0.0.0.0/0
permit = {{external_media_address}}
; permit = stun.l.google.com   ; optional, if using Google STUN

[iax-peers]
; IAX peers that are allowed to reach us. Deny all else, then permit your
; provider IPs. The builder should emit one permit= per provider CIDR.
deny = 0.0.0.0/0
permit = {{iax_provider_ip_1}}
permit = {{iax_provider_ip_2}}