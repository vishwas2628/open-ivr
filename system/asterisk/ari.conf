; ARI REST API configuration
;
; MANAGED BY OPENIVR - see system/asterisk/README.md
;
; Rendered by system/steps/30-ari.sh (installer) - {{ari_user}} and {{ari_pass}}
; are filled from the secret the step generates, and the same values are
; written into config.yaml (ari.username / ari.password).

[general]
enabled = yes
pretty = yes
allowed_origins = *
websocket_write_timeout = 100
auth_realm = Asterisk REST Interface
; You can override with ENV variables dynamically if you mount via Docker
;allowed_origins = http://ari.asterisk.org

; Primary ARI user for the IVR.
[{{ari_user}}]
type = user
read_only = no
password = {{ari_pass}}
format = wav,ulaw,alaw
; Comma separated list of Stasis apps this user may register for:
;   openivr       - the IVR itself (must equal config.yaml app.stasis_app)
;   openivr-admin - monitoring / management app
stasis_app = openivr,openivr-admin