; Asterisk master configuration
;
; MANAGED BY OPENIVR - see system/asterisk/README.md
;
; The [directories] section controls all filesystem paths. Tokens are
; resolved by the builder/installer from system.json or defaults.

[directories]
astcachedir => /var/cache/asterisk
astetcdir => {{astetcdir}}
astmoddir => /usr/lib/x86_64-linux-gnu/asterisk/modules
astvarlibdir => {{astvarlibdir}}
astdbdir => {{astdbdir}}
astkeydir => {{astkeydir}}
astdatadir => /var/lib/asterisk
astagidir => /var/lib/asterisk/agi-bin
astspooldir => {{astspooldir}}
astrundir => {{astrundir}}
astlogdir => {{astlogdir}}
astvarrundir => {{astrundir}}
astctl => asterisk.ctl
astpidfile => asterisk.pid
astsbindir => /usr/sbin

[options]
;verbose = 3
;debug = 3
;trace = 0
;refdebug = yes
;alwaysfork = yes
;nofork = yes
;quiet = yes
;timestamp = yes
;execincludes = yes
;console = yes
;highpriority = yes
;initcrypto = yes
;nocolor = yes
;dontwarn = yes
;dumpcore = yes
;languageprefix = yes
;systemname = my_system_name
;autosystemname = yes
;mindtmfduration = 80
;maxcalls = 10
;maxload = 0.9
;maxfiles = 1000
;minmemfree = 1
;cache_media_frames = yes
;cache_record_files = yes
;record_cache_dir = /tmp
;transmit_silence = yes
;transcode_via_sln = yes
;runuser = asterisk
;rungroup = asterisk
;lightbackground = yes
;forceblackbackground = yes
;defaultlanguage = en
documentation_language = en_US
;hideconnect = yes
;lockconfdir = no
;stdexten = gosub
;live_dangerously = no
;entityid = 00:11:22:33:44:55
;rtp_use_dynamic = yes
;rtp_pt_dynamic = 35
;hide_messaging_ami_events = no
;sounds_search_custom_dir = no

; Changing the following lines may compromise your security.
;[files]
;astctlpermissions = 0660
;astctlowner = root
;astctlgroup = asterisk
;astctl = asterisk.ctl