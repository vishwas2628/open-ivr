; Asterisk Call Detail Record engine configuration
;
; MANAGED BY OPENIVR - see system/asterisk/README.md
;
; This file is THE call log for the platform. The Python side
; (openivr/cdr.py) is an IVR *event* log only - menu navigation, DTMF digits,
; per-step timings. It is not the call record.
;
; Backend: cdr_csv.so only (see modules.conf). cdr_pgsql.conf was removed on
; purpose - call logs land as CSV under /var/log/asterisk/cdr-csv/, and one
; file per accountcode under /var/log/asterisk/cdr/account/.
;
; Correlation key: the [csv] loguniqueid flag writes Asterisk's ${UNIQUEID},
; which is also what logger.conf use_callids=yes puts on every log line. The
; IVR event log rows are keyed on the same value.
;
; Tenant / flow tags arrive as channel variables set by the dialplan
; (extensions/outgoing.conf, extensions/openivr-dial):
;   CHANNEL(accountcode)  -> the [csv] accountlogs per-account files
;   CDR(userfield)        -> the [csv] loguserfield column

[general]

; Master switch. Setting this to "no" overrides any loaded CDR backend module.
enable = yes

; Log calls that never reached an outgoing party (unanswered internal calls).
unanswered = yes

; Log calls that failed to complete due to congestion.
congestion = yes

; Close the CDR before the "h" extension / hangup handlers run, so that
; "end" and "billsec" are readable from within those handlers.
endbeforehexten = no

; Round billsec up when the sub-second part of the end time exceeds the
; sub-second part of the answer time. Slightly more honest billing.
initiatedseconds = yes

; Post each CDR at end of call rather than buffering. Batch mode risks data
; loss on an unsafe shutdown; we keep it off so a crash loses at most the
; call in flight.
batch = no
scheduleronly = no
safeshutdown = yes

; --- CSV backend -------------------------------------------------------
; No database, no rotation surprises, and accountlogs gives us per-tenant
; files for free. readcsv/astdblinkage columns stay at their defaults.
[csv]
usegmtime = yes         ; timestamps in UTC (host tz is only for the console)
loguniqueid = yes        ; column "uniqueid" = ${UNIQUEID}, our call id
loguserfield = yes       ; column "userfield" = CDR(userfield)
accountlogs = yes        ; /var/log/asterisk/cdr/account/<accountcode>.csv
newcdrcolumns = yes      ; peeraccount, linkedid, sequence

; Not used here - other backends are noloaded in modules.conf. Left in place
; so it is obvious they were considered and rejected, not forgotten.
;[radius]
;[pgsql]
;[odbc]
