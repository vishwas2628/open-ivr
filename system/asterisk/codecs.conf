; Audio/Video codec configuration
;
; MANAGED BY OPENIVR - see system/asterisk/README.md
;
; The dialplan uses allow=ulaw,alaw and allow=opus,ulaw,alaw. This file
; declares those formats so the module loader doesn't complain about
; unknown codec names in endpoint allow= lists.

[general]

[ulaw]
type = codec
format = ulaw
bitrate = 64000

[alaw]
type = codec
format = alaw
bitrate = 64000

[opus]
type = codec
format = opus
bitrate = 64000
; Opus options (Asterisk 18+)
;maxptime = 60
;ptime = 20
;minptime = 10
; useinbandfec = 1
; usedtx = 1
; maxaveragebitrate = 510000
; cbr = 0