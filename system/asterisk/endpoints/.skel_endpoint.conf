; PJSIP user endpoint template (UDP/TCP softphone)
;
; NOT loaded by Asterisk - leading '.' prevents the #tryinclude globs
; from matching this file. Copy to endpoints/<username>.conf and
; replace every USERNAME token with the actual username, and
; SECRET_PASSWORD with the generated password.
;
; Naming contract (README.md): the same base name is used with role
; suffixes. For a user named "alice":
;   alice          type=endpoint
;   alice-aor      type=aor
;   alice-auth     type=auth
;
; Transport: transport-udp by default. For WebRTC, change to
; transport-ws and uncomment the media_encryption/dtls lines below.

[USERNAME]
type = endpoint
transport = transport-udp
context = extensions
callerid = "USERNAME" <USERNAME>
disallow = all
allow = ulaw,alaw,opus
; WebRTC variant - uncomment and switch transport if needed:
; transport = transport-ws
; use_avpf = yes
; ice_support = yes
; media_encryption = dtls
; dtls_auto_generate_cert = yes
; dtls_setup = actpass
; dtls_verify = fingerprint
; dtls_cert_file = /etc/asterisk/keys/asterisk.pem
; dtls_private_key = /etc/asterisk/keys/asterisk.key
; dtls_cipher = HIGH
; timers = yes
; timers_min_se = 90
; timers_sess_expires = 1800
; rtp_timeout = 120
; rtp_timeout_hold = 300
; rtp_keepalive = 50
direct_media = no
rtp_symmetric = yes
rewrite_contact = yes
force_rport = yes
auth = USERNAME-auth
aors = USERNAME-aor


[USERNAME-aor]
type = aor
max_contacts = 5
remove_existing = yes
qualify_frequency = 30


[USERNAME-auth]
type = auth
auth_type = userpass
username = USERNAME
password = SECRET_PASSWORD