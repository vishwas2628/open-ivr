; PJSIP provider trunk template
;
; NOT loaded - leading '.' hides it from #tryinclude endpoints/trunks/*.conf.
; Copy to endpoints/trunks/<trunk>.conf, replace TRUNK with the trunk name
; (e.g. "bsnl", "jio", "airtel"), and fill every {{token}}.
;
; Naming contract (README.md): all sections use the trunk name as prefix
; with role suffixes.
;   TRUNK-auth       auth
;   TRUNK-aor        aor
;   TRUNK-out        endpoint (outbound)
;   TRUNK-in         endpoint (inbound)
;   TRUNK-reg        registration
;   TRUNK-identify   identify (IP-based inbound matching)
;
; Transport: uses {{trunk_transport}} (default transport-udp). If the
; provider requires a dedicated transport, define one in pjsip.conf and
; set the token accordingly.
;
; Provider IPs: add up to three match= lines. The builder should emit one
; per CIDR. If more are needed, extend the section manually.

[TRUNK-auth]
type = auth
auth_type = userpass
username = {{trunk_username}}
password = {{trunk_password}}


[TRUNK-aor]
type = aor
contact = sip:{{host_fqdn_with_port}}
max_contacts = 20
qualify_frequency = 30


[TRUNK-out]
type = endpoint
transport = {{trunk_transport}}
aors = TRUNK-aor
outbound_auth = TRUNK-auth
from_domain = {{host_fqdn}}
disallow = all
allow = ulaw,alaw
direct_media = no
rtp_symmetric = yes
rewrite_contact = yes
force_rport = yes
timers = yes
timers_min_se = 90
timers_sess_expires = 1800
rtp_timeout = 120
rtp_timeout_hold = 300
rtp_keepalive = 50


[TRUNK-in]
type = endpoint
transport = {{trunk_transport}}
context = {{inbound_context}}
auth = TRUNK-auth
disallow = all
allow = ulaw,alaw
direct_media = no
rtp_symmetric = yes
rewrite_contact = yes
force_rport = yes
timers = yes
timers_min_se = 90
timers_sess_expires = 1800
rtp_timeout = 120
rtp_timeout_hold = 300
rtp_keepalive = 50


[TRUNK-reg]
type = registration
transport = {{trunk_transport}}
outbound_auth = TRUNK-auth
server_uri = sip:{{host_fqdn_with_port}}
client_uri = {{client_uri}}
retry_interval = 60
max_retries = 100
expiration = 300


[TRUNK-identify]
type = identify
endpoint = TRUNK-in
; One match= per provider CIDR/range. Builder emits as many as needed.
match = {{trunk_ip_1}}
match = {{trunk_ip_2}}
match = {{trunk_ip_3}}