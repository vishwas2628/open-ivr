; Dialplan root
;
; MANAGED BY OPENIVR - see system/asterisk/README.md for the token registry.
;
; Layout
;   [general]/[globals]   fixed, tokenised globals
;   #tryinclude extensions/   one file per extension, written by the builder
;   [from-trunk]          inbound, the target of pjsip context={{inbound_context}}
;   [openivr-ivr]         Stasis() entry point for the IVR application
;   [openivr-dial]        target of ARI channel.continueInDialplan()
;   [extensions]          shared context all extensions live in + routing
;   [outgoing*]           see extensions/outgoing.conf
;
; Every extensions/<N>.conf contributes a single `exten => <N>` line to the
; shared [extensions] context, so endpoints can all carry the same
; `context=extensions` and there is one catch-all router instead of a
; pattern per extension. No REGEX() validation anywhere.

[general]
static = yes
writeprotect = no
clearglobalvars = no

[globals]
; {{stasis_app}}          must equal config.yaml app.stasis_app
; {{ring_timeout}}        seconds an extension rings before the queue/leg times out
; {{dial_timeout}}        seconds an outbound trunk leg is given
; {{max_call_duration}}   hard ceiling on any call (TIMEOUT(absolute))
; {{company_id}}          default accountcode when ARI does not supply one
STASIS_APP = {{stasis_app}}
RING_TIMEOUT = {{ring_timeout}}
DIAL_TIMEOUT = {{dial_timeout}}
MAX_CALL_DURATION = {{max_call_duration}}
DEFAULT_ACCOUNTCODE = {{company_id}}

; One file per object. The directory is inlined here, so sections defined by
; the builder are merged into this file's contexts - every section name used
; in them must be globally unique across the whole dialplan.
#tryinclude extensions/*.conf

; ------------------------------------------------------------------ inbound
; pjsip.conf trunk endpoints carry context={{inbound_context}}; the default
; value of that token is "from-trunk".
[from-trunk]
exten => _.,1,NoOp(inbound ${CALLERID(num)} -> ${EXTEN})
     same => n,Set(CHANNEL(accountcode)=${DEFAULT_ACCOUNTCODE})
     same => n,Set(CDR(userfield)=inbound:${EXTEN}:${CALLERID(num)})
     same => n,Set(TIMEOUT(absolute)=${MAX_CALL_DURATION})
     same => n,Answer()
     same => n,Stasis(${STASIS_APP},${EXTEN},${CALLERID(num)},${CALLERID(name)})
     same => n,Hangup()

; --------------------------------------------------------------------- ivr
; Static entry point - reachable from a local channel without an inbound
; trunk, e.g. Local/6001@openivr-ivr,1
[openivr-ivr]
exten => s,1,NoOp(openivr IVR entry ${CALLERID(num)})
     same => n,Set(TIMEOUT(absolute)=${MAX_CALL_DURATION})
     same => n,Answer()
     same => n,Stasis(${STASIS_APP},s,${CALLERID(num)},${CALLERID(name)})
     same => n,Hangup()

; ----------------------------------------------------------------- handoff
; Target of ARI channel.continueInDialplan() - config dial.context/openivr-dial.
; This is the supported outbound path; originate (openivr/originate.py) is
; legacy. The IVR sets OPENIVR_DIAL_TARGET (an extension or a number, never
; prefixed with "PJSIP/") immediately before handing the channel back.
[openivr-dial]
exten => s,1,NoOp(openivr handback target=${OPENIVR_DIAL_TARGET})
     same => n,GotoIf($["${OPENIVR_DIAL_TARGET}" = ""]?notarget)
     same => n,Set(CHANNEL(accountcode)=${IF($["${OPENIVR_ACCOUNTCODE}" != ""]?${OPENIVR_ACCOUNTCODE}:${DEFAULT_ACCOUNTCODE})})
     same => n,Set(CDR(userfield)=ivr:${OPENIVR_CALL_ID}:${OPENIVR_MENU}:${OPENIVR_DIGITS})
     same => n,Set(CDRIVRDEST=${OPENIVR_DIAL_TARGET})
     same => n,GotoIf($[${LEN(${OPENIVR_DIAL_TARGET})} <= 6]?internal:trunk)

     same => n(internal),Goto(extensions,${OPENIVR_DIAL_TARGET},1)

     same => n(trunk),Goto(outgoing,${OPENIVR_DIAL_TARGET},1)

     same => n(notarget),Log(WARNING,openivr-dial reached with no OPENIVR_DIAL_TARGET)
     same => n,Playback(pbx-invalid)
     same => n,Hangup()

; ------------------------------------------------- shared extension context
; endpoints/<user>.conf points every endpoint at `context=extensions`.
; extensions/<N>.conf supplies `exten => <N>`; an exact match always wins over
; the catch-all below, so this context only fires for a number we do not own.
[extensions]
exten => _.,1,NoOp(no local extension ${EXTEN}, routing onward)
     same => n,GotoIf($[${LEN(${EXTEN})} <= 6]?unknown:trunk)

     same => n(unknown),Log(WARNING,openivr: no extension configured for ${EXTEN})
     same => n,Playback(pbx-invalid)
     same => n,Hangup()

     same => n(trunk),Goto(outgoing,${EXTEN},1)
; End of Automated Editing
