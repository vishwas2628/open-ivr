; Outbound trunk dialing
;
; Inlined into the dialplan by the #tryinclude in extensions.conf, so the
; context names below are part of the global registry - see README.md.
;
; Flow:  [extensions] or [openivr-dial]
;          -> [outgoing]           normalise to E.164
;          -> [outgoing-common]    tag the CDR, ring, handle DIALSTATUS
;          -> [outgoing-record]    MixMonitor gosub, only when recording is on
;
; Tokens are filled by the builder (see README.md).

[outgoing]
; Every destination arrives here unprefixed: an extension number, a national
; number, or an already-E.164 string. Normalise once, then hand off.
exten => _.,1,NoOp(outbound ${EXTEN})
     same => n,GotoIf($["${EXTEN:0:1}" = "+"]?common)
     same => n,GotoIf($["${EXTEN:0:1}" = "0"]?national:local)

     same => n(national),Goto(outgoing-common,{{country_code}}${EXTEN:1},1)

     same => n(local),Goto(outgoing-common,{{country_code}}${EXTEN},1)

     same => n(common),Goto(outgoing-common,${EXTEN},1)


[outgoing-common]
; Single outgoing handler - all CDR tagging and recording policy lives here.
exten => _+X.,1,NoOp(OUTBOUND ${EXTEN})
     same => n,Set(CHANNEL(accountcode)={{company_id}})
     same => n,Set(CDR(userfield)=outbound:${CALLERID(num)}:${EXTEN})
     same => n,Set(CALLERID(num)={{outbound_cli}})
     same => n,Set(LAST4=${EXTEN:-4})
     same => n,Set(__RECORDING_ID=${UNIQUEID}_${LAST4})
     same => n,Set(TIMEOUT(absolute)=${MAX_CALL_DURATION})
     same => n,Log(NOTICE,openivr outbound cli=${CALLERID(num)} dest=${EXTEN} uniqueid=${UNIQUEID})

     same => n,GotoIf($["{{outbound_recording}}" = "1"]?with-recording:without-recording)

     same => n(with-recording),Dial(PJSIP/${EXTEN}@{{trunk_out_endpoint}},${DIAL_TIMEOUT},U(outgoing-record^s^1))
     same => n,Goto(dial-result)

     same => n(without-recording),Dial(PJSIP/${EXTEN}@{{trunk_out_endpoint}},${DIAL_TIMEOUT})

     same => n(dial-result),Log(NOTICE,openivr outbound result=${DIALSTATUS} uniqueid=${UNIQUEID})
     same => n,GotoIf($["${DIALSTATUS}" = "ANSWER"]?done:failed)

     same => n(failed),Playback(vm-goodbye)
     same => n(done),Hangup()


; Gosub executed on the A-leg at answer time via Dial U() - only runs when the
; remote party answers, so unanswered calls leave no recording file behind.
[outgoing-record]
exten => s,1,NoOp(outbound recording ${RECORDING_ID})
     same => n,Set(RECORDING_FILE={{recording_path}}/${RECORDING_ID}.wav)
     same => n,MixMonitor(${RECORDING_FILE},b)
     same => n,Return()
