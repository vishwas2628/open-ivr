; Feature application configuration
;
; MANAGED BY OPENIVR - see system/asterisk/README.md
;
; Parking, call forwarding, DISA, call waiting, etc.
; The builder does not currently generate any of these, but they exist
; so that Asterisk can serve them if the UI adds them.

[general]
; Parking
parkext => 700
parkpos => 701-720
context => parkedcalls
parkingtime => 45
comebacktoorigin = yes
courtesytone = beep
courtesytone = silence/1
pickupexten = *8

; Call forwarding / followme (requires app_followme.so - noloaded by default)
; followme => 300,1,FollowMe(s,10)

; DISA (requires app_disa.so - noloaded by default)
; disa => 9900,no-password,from-trunk

; Call waiting
callwaiting = yes

; Pickup groups
pickupexten = *8
;[featuremap]
;blindxfer => #1
;atxfer => *2
;disconnect => ***
;automon => *1
;automixmon => *3