; HTTP server for ARI and WebSocket
;
; MANAGED BY OPENIVR - see system/asterisk/README.md
;
; This must match 30-ari.sh exactly: bindaddr={{ari_bind}}, bindport={{http_port}},
; prefix=/ari, enablestatic=no, sessionlimit=100.

[general]
enabled = yes
pretty = yes
allowed_origins = *
bindaddr = {{ari_bind}}
bindport = {{http_port}}
prefix = /ari
enablestatic = no
sessionlimit = 100