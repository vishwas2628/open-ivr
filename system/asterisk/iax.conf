; IAX2 peers (handsets / analogue adapters)
;
; MANAGED BY OPENIVR - see system/asterisk/README.md
;
; The builder writes one file per IAX user under iax/<username>.conf.
; Template files named .skel_*.conf are not matched by the glob.

[general]
bindaddr = 0.0.0.0
disallow = all
allow = ulaw,alaw
delayreject = yes
autokill = yes

