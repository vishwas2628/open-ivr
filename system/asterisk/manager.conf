; Asterisk Manager Interface (AMI) configuration
;
; MANAGED BY OPENIVR - see system/asterisk/README.md
;
; manager.so is built into the core and cannot be unloaded. This file
; gates AMI access - the default is disabled. The builder or admin can
; enable it by changing enabled = yes and adding a user section.

[general]
enabled = no
port = 5038
bindaddr = 127.0.0.1
displayconnects = yes
; Multiple users: add [user] sections below.
; Example:
;[openivr]
;secret = {{ami_password}}
;read = system,call,log,verbose,command,agent,user,config
;write = system,call,log,verbose,command,agent,user,config
;deny = 0.0.0.0/0.0.0.0
;permit = 127.0.0.1/255.255.255.255