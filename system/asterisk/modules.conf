;
; Asterisk configuration file
;
; Module Loader configuration file
;
; Managed by openivr. Decisions here are deliberate - see README.md in this
; directory before adding or removing a load/noload line.
;

[modules]
autoload=yes

; --- Channel drivers and transports ---
load => chan_pjsip.so
load => res_pjsip.so
load => res_pjsip_transport_websocket.so
load => res_pjsip_endpoint_identifier_user.so
load => res_pjsip_authenticator_digest.so
load => res_pjsip_session.so
load => res_rtp_asterisk.so

; --- ARI / Stasis (the IVR integration) ---
load => res_ari.so
load => res_ari_model.so
load => app_stasis.so
load => res_http_websocket.so
load => func_curl.so

; --- Dialplan applications used by the skeleton ---
load => app_dial.so
load => app_queue.so
load => app_mixmonitor.so
load => app_voicemail.so
load => app_playback.so
load => app_externalivr.so

; --- Music on hold ---
load => res_musiconhold.so

; --- CDR: csv is the ONLY backend (see cdr.conf) ---
load => cdr_csv.so
noload => cdr_pgsql.so
noload => cdr_mysql.so
noload => cdr_custom.so
noload => cdr_manager.so
noload => cdr_odbc.so
noload => cdr_adaptive_odbc.so
noload => cdr_syslog.so
noload => cdr_sqlite3_custom.so
noload => cdr_tds.so
noload => cdr_beanstalkd.so

; --- CEL is disabled entirely: cdr.conf is the call-log standard here.
; cel.so is built into the core and cannot be unloaded, so it stays loaded
; with no backends and no cel.conf. stasis.conf no longer references it. ---
noload => cel_odbc.so
noload => cel_pgsql.so
noload => cel_custom.so
noload => cel_csv.so
noload => cel_sqlite3_custom.so
noload => cel_tds.so
noload => cel_beanstalkd.so

; --- ODBC / Realtime backends: disabled, nothing here uses them ---
noload => res_odbc.so
noload => func_odbc.so
noload => res_config_ldap.so
noload => res_config_sqlite3.so
noload => res_config_mysql.so
noload => res_config_odbc.so
; We render pjsip.conf ourselves; the wizard would fight us for it.
noload => res_pjsip_config_wizard.so

; --- Unused services that log to syslog / emit metrics ---
noload => res_smdi.so
noload => res_statsd.so
noload => res_geolocation.so
noload => res_hep.so
noload => res_hep_pjsip.so
noload => res_hep_rtcp.so
noload => res_snmp.so
noload => res_prometheus.so

; --- Console / GUI / obsolete channel drivers ---
noload => pbx_gtkconsole.so
noload => pbx_kdeconsole.so
noload => app_intercom.so
noload => chan_modem.so
noload => chan_modem_aopen.so
noload => chan_modem_bestdata.so
noload => chan_modem_i4l.so
noload => chan_capi.so
noload => chan_alsa.so
noload => chan_console.so
noload => chan_oss.so
noload => app_directory_odbc.so
; cdr_sqlite writes unconditionally to cdr.db with no rotation control.
noload => cdr_sqlite.so

; manager.so is built into the core and cannot be unloaded. AMI itself is
; gated by manager.conf [general] enabled = no.
; noload => manager.so ; Cannot unload built-in module

;
; Any modules that need to be loaded before the Asterisk core has been
; initialized (just after the logger has been initialized) can be loaded
; using 'preload'. This will frequently be needed if you wish to map all
; module configuration files into Realtime storage, since the Realtime
; driver will need to be loaded before the modules using those configuration
; files are initialized.
;
;preload => res_odbc.so
;preload => res_config_odbc.so
;
; Module names listed in "global" section will have symbols globally
; exported to modules loaded after them.
;
[global]
