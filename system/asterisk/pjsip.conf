; PJSIP resource configuration
;
; MANAGED BY OPENIVR - see system/asterisk/README.md
;
; This file owns only what cannot be per-object: the global section and the
; transports. Everything else - users, trunks - is one file per object under
; endpoints/, rendered by the builder.
;
;   endpoints/<user>.conf          a softphone / handset
;   endpoints/trunks/<trunk>.conf  a provider trunk
;
; Section names are merged across all of those files, so they must be
; globally unique. The convention (see README.md) is <object>-<role>:
;   <user>           endpoint      <user>-aor       aor      <user>-auth      auth <trunk>         endpoint      ...

[global]
type = global
; report_bundled_history = no

; ---------------------------------------------------------------- transports
; One per protocol. Endpoints select theirs with `transport=<name>`.
; transport-ws is required by the WebRTC user template even though DTLS-SRTP
; does the media encryption, because WebRTC always carries SIP over WebSocket.
; It is bound to {{http_port}} so it shares the ARI/HTTP listener's port.
[transport-udp]
type = transport
protocol = udp
bind = 0.0.0.0
allow_reload = yes
; external_media_address = {{external_media_address}}

[transport-tcp]
type = transport
protocol = tcp
bind = 0.0.0.0
allow_reload = yes

[transport-ws]
type = transport
protocol = ws
bind = 0.0.0.0:{{http_port}}
allow_reload = yes

; ------------------------------------------------------------------ includes
; Both globs are inlined into this file by the Asterisk config engine.
; Template files here are named `.skel_*.conf` - a leading '.' is never
; matched by a `*` glob, so they can never be loaded as real config.
#tryinclude endpoints/*.conf
#tryinclude endpoints/trunks/*.conf
