; Call Queues configuration
;
; MANAGED BY OPENIVR - see system/asterisk/README.md
;
; The builder writes one file per extension using ringall into
; queues/<ext>.conf (inlined by #tryinclude in the real config or
; merged here if the admin prefers a single file).
;
; Each per-extension queue uses the ringall strategy and the naming
; convention: the queue name equals the extension number.
;
; Tokens in [general]:
;   {{queue_strategy}}      ringall (default)
;   {{ring_timeout}}        seconds an agent rings before next is tried
;   {{max_rings}}           max ring cycles before caller falls through
;   persistentmembers = yes

[general]
persistentmembers = yes
; autofill = yes
; monitor-type = MixMonitor
; shared_lastcall = yes
; negative_penalty_invalid = no
; log_membername_as_agent = no
; log-caller-id-name = no
; log-restricted-caller-id = yes
; force_longest_waiting_caller = no

; One file per ringall extension, written by the builder.
#tryinclude queues/*.conf

; Queue strategy: ringall, rrmemory, linear, random, etc.
; The builder sets this per-queue in its file. The global is a default.
strategy = {{queue_strategy}}

; Default ring timeout for queues (seconds per agent)
ring_timeout = {{ring_timeout}}

; Default max rings before the queue call falls through
; (number of times to cycle through all members)
max_rings = {{max_rings}}

; Example queue template (builder writes to queues/<N>.conf):
; [1001]
; strategy = ringall
; timeout = 15
; retry = 5
; wrapuptime = 0
; member = Local/1001@extensions
; member = Local/1002@extensions
; member = Local/1003@extensions