; PostgreSQL Realtime driver configuration
;
; MANAGED BY OPENIVR - see system/asterisk/README.md
;
; Required because modules.conf loads res_config_pgsql.so (used by the
; 60-database.sh step for CDR table provisioning). The actual CDR backend
; is cdr_csv.so; this is only for Realtime config if ever needed.

[general]
dbhost = {{DB_HOST}}
dbport = {{DB_PORT}}
dbname = {{DB_NAME}}
dbuser = {{DB_USER}}
dbpass = {{DB_PASS}}
; dbencoding = UTF8
; dbtable = cdr
; dbtimezone = Asia/Kolkata