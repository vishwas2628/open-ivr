; RTP Configuration
;
; MANAGED BY OPENIVR - see system/asterisk/README.md
;
; Tokens:
;   {{rtpstart}} / {{rtpend}}       RTP port range (default 10000-20000)
;   {{stunaddr}}                    STUN server for external IP discovery
;   {{external_media_address}}      public IP/FQDN for media (behind NAT)
;   {{ice_acl}}                     named ACL from acl.conf for ICE (default: rtp-ice)

[general]
rtpstart = {{rtpstart}}
rtpend = {{rtpend}}
icesupport = yes
stunaddr = {{stunaddr}}
external_media_address = {{external_media_address}}
ice_acl = {{ice_acl}}

; rtcpinterval = 5000
; dtmftimeout = 3000
; strictrtp = yes
; probation = 8
; srtpreplayprotection = yes
; icesupport = yes
; stun_software_attribute = yes

; STUN/TURN ACLs are handled by the {{ice_acl}} named ACL above.
; stun_acl = {{ice_acl}}

; turnaddr =
; turnusername =
; turnpassword =

; dtls_mtu = 1200

[ice_host_candidates]
; Define only when behind 1:1 static NAT with known public IP.
; <local address> => <advertised address>[,include_local_address]