; Voicemail Configuration
;
; MANAGED BY OPENIVR - see system/asterisk/README.md
;
; Rendered by the builder's "Permissions & Voicemail" step
; (openivr/builder/render.py::render_voicemail).
;
; Tokens:
;   {{format}}        message format (wav, ulaw, alaw, gsm, sln, sln16)
;   {{maxsecs}}        maximum message length in seconds
;   {{maildir}}        Asterisk voicemail spool directory (absolute)
;   {{smtp_host}}      SMTP relay (empty -> voicemail email disabled)
;   {{smtp_port}}      SMTP port
;   {{smtp_from}}      From: address for voicemail notifications
;   {{smtp_user}}      SMTP username (empty -> unauthenticated relay)
;   {{smtp_pass}}      SMTP password
;
; If no SMTP is configured, smtpserver stays empty - voicemail email
; will be disabled but voicemail itself works fine.

[general]
format = {{format}}
serveremail = {{smtp_from}}
attach = yes
smtpserver = {{smtp_host}}
smtpport = {{smtp_port}}
smtpfrom = {{smtp_from}}
smtpuser = {{smtp_user}}
smtppassword = {{smtp_pass}}
; sslversion = tls1.2
; tlsrequired = no
minsecs = 3
maxsecs = {{maxsecs}}
maxgreet = 60
silencethreshold = 128
maxlogins = 3
maildir = {{maildir}}

; Voicemail boxes are written by the builder as separate files
; included via #tryinclude in the real config, or directly in this
; file's [default] context. For now, the builder manages [default]
; inline. The markers below delimit the builder-managed block.

; voice_mail_login_configuration
[default]
; EOF voice_mail_login_configuration